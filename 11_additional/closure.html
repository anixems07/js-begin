    //practical use of closures
    
    function clickHandler(color) {
        // document.body.style.backgroundColor = `${color}`  // this caused the automatic change in color without even clicking the button
        return function() {
            document.body.style.backgroundColor=`${color}`
        }
    }
    
    // document.getElementById('orange').onclick = clickHandler("orange") //this exexcuted and then was assigned so it set the color even before clicking

    document.getElementById('orange').onclick = clickHandler("orange")
    document.getElementById('green ').onclick = clickHandler("green")
